<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Heal Grow Records</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/flubber@0.4.2/build/flubber.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #C8FF00;
      --accent-dim: rgba(200, 255, 0, 0.18);
      --bg-primary: #080808;
      --bg-secondary: #0f0f0f;
      --text-primary: #f5f5f5;
      --text-dim: rgba(255, 255, 255, 0.4);
      --border: rgba(200, 255, 0, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        repeating-linear-gradient(
          0deg,
          rgba(200, 255, 0, 0.02) 0px,
          transparent 1px,
          transparent 2px,
          rgba(200, 255, 0, 0.02) 3px
        );
      pointer-events: none;
      z-index: 1;
    }

    #hero {
      min-height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #hero-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .app-core {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .morph-space {
      position: relative;
      width: 100%;
      aspect-ratio: 2.4 / 1;
      max-height: 500px;
      margin-bottom: 40px;
    }

    #lhg-player-svg {
      width: 100%;
      height: 100%;
    }

    .state-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .state-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .ui-panel {
      background: rgba(17, 17, 17, 0.8);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
    }

    .panel-music-l {
      overflow-y: auto;
      max-height: 100%;
    }

    .track-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-item {
      padding: 12px;
      background: rgba(200, 255, 0, 0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .track-item:hover {
      background: rgba(200, 255, 0, 0.1);
      border-color: var(--accent);
    }

    .track-item.active {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .track-title {
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .track-artist {
      font-size: 9px;
      color: var(--text-dim);
    }

    .panel-music-h {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .txt-title {
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      letter-spacing: 2px;
    }

    .txt-sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
      text-align: center;
    }

    .timer-disp {
      font-size: 32px;
      font-weight: 300;
      font-family: 'DM Mono', monospace;
      color: var(--accent);
      margin: 8px 0;
    }

    .flex-center-gap {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .btn-solid, .btn-ghost {
      padding: 12px 24px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .btn-solid {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .btn-solid:hover {
      background: transparent;
      color: var(--accent);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-primary);
    }

    .btn-ghost:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .panel-music-g {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    #progress-container {
      margin-top: auto;
      position: relative;
      width: 100%;
      height: 4px;
      background: rgba(200, 255, 0, 0.1);
      cursor: pointer;
      border-radius: 2px;
      overflow: hidden;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    .panel-blog-l h2 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .panel-blog-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .blog-post {
      padding: 16px;
      background: rgba(200, 255, 0, 0.05);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .blog-post:hover {
      background: rgba(200, 255, 0, 0.1);
      border-color: var(--accent);
    }

    .blog-post h3 {
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--accent);
    }

    .blog-post p {
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
    }

    .blog-post-date {
      font-size: 9px;
      color: var(--text-dim);
      margin-top: 8px;
      letter-spacing: 1px;
    }

    .footer-link {
      display: inline-block;
      margin-top: auto;
      padding: 12px;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      transition: all 0.2s ease;
    }

    .footer-link:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
    }

    .hero-eyebrow {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .logo-subtitle {
      font-family: 'Syne', sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 6px;
      text-align: center;
      color: var(--accent);
      margin-top: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(200, 255, 0, 0.5);
    }

    .hero-ctas {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 32px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      background: transparent;
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .nav-btn:hover {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .nav-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    @media (max-width: 768px) {
      .state-overlay {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }

      .morph-space {
        aspect-ratio: 1 / 1;
      }

      .logo-subtitle {
        font-size: 20px;
        letter-spacing: 4px;
      }
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(200, 255, 0, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--accent-dim);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }
  </style>
</head>

<body>

  <section id="hero">
    <canvas id="hero-canvas"></canvas>
    <div class="app-core">
      <div class="morph-space is-home">
        <svg id="lhg-player-svg" viewBox="0 0 1200 500" preserveAspectRatio="none">
          <defs>
            <filter id="neon-glow">
              <feGaussianBlur stdDeviation="3" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- L Character -->
          <g transform="translate(180, 300)" id="grp-l-wrap">
            <g id="grp-l">
              <g transform="scale(0.2, -0.2) translate(-190, -314)">
                <path id="char-l" fill="var(--accent)" filter="url(#neon-glow)"
                  d="M190 669 l0 -355 84 -82 84 -82 281 0 281 0 0 105 0 105 -260 0 -260 0 0 233 0 232 -77 76 c-43 41 -90 85 -105 99 l-28 23 0 -354z" />
              </g>
            </g>
          </g>

          <!-- H Character -->
          <g transform="translate(520, 300)">
            <g id="grp-h">
              <g id="grp-h-scale">
                <g transform="scale(0.2, -0.2) translate(-1010, -314)">
                  <path id="char-h" fill="var(--accent)" filter="url(#neon-glow)"
                    d="M1010 585 l0 -436 133 3 132 3 3 103 3 102 -91 0 -90 0 0 225 0 225 90 0 90 0 0 -220 0 -220 190 0 190 0 0 220 0 220 90 0 90 0 0 -225 0 -225 -90 0 -90 0 0 -105 0 -106 130 3 131 3 0 430 -1 430 -130 3 -130 3 0 -106 0 -105 -192 2 -193 3 -3 103 -3 102 -129 0 -130 0 0 -435z" />
                </g>
              </g>
            </g>
          </g>

          <!-- G Character -->
          <g transform="translate(880, 300)" id="grp-g-wrap">
            <g id="grp-g">
              <g transform="scale(0.2, -0.2) translate(-2081, -314)">
                <path id="char-g" fill="var(--accent)" filter="url(#neon-glow)"
                  d="M2081 952 l-72 -68 3 -305 3 -306 27 -40 c16 -25 43 -48 72 -61 43 -21 61 -22 305 -22 l259 0 76 82 76 82 -2 170 -3 171 -207 3 -208 2 0 -80 0 -80 105 0 105 0 0 -70 0 -70 -200 0 -200 0 0 225 0 225 300 0 300 0 0 105 0 105 -334 0 -334 0 -71 -68z" />
              </g>
            </g>
          </g>
        </svg>

        <!-- HTML VIEWS -->
        <div id="state-home" class="state-overlay active"></div>

        <!-- MUSIC STATE -->
        <div id="state-music" class="state-overlay">
          <div class="ui-panel panel-music-l">
            <div id="track-list" class="track-list">
              <!-- Tracks will be injected here -->
            </div>
          </div>
          <div class="ui-panel panel-music-h">
            <div class="txt-title" id="audio-title">LIQUID FREQUENCIES</div>
            <div class="txt-sub" id="audio-artist">SELECT A TRACK</div>
            <div class="timer-disp" id="audio-time">00:00</div>

            <div class="flex-center-gap">
              <button class="btn-ghost" onclick="prevTrack()" aria-label="Previous Track">Prev</button>
              <button class="btn-solid" onclick="togglePlay()" id="play-btn" aria-label="Toggle Playback">Play</button>
              <button class="btn-ghost" onclick="nextTrack()" aria-label="Next Track">Next</button>
            </div>
          </div>
          <div class="ui-panel panel-music-g">
            <div id="progress-container" onclick="seekAudio(event)">
              <div id="progress-bar"></div>
            </div>
            <div style="margin-top:12px; font-size:7px; letter-spacing:2px; color:var(--text-dim); text-align:center;">
              // AUDIO_DATA_STREAM // 174_BPM</div>
          </div>
        </div>

        <!-- BLOG STATE -->
        <div id="state-blog" class="state-overlay">
          <div class="ui-panel panel-blog-l">
            <h2>Process<br>& Signal</h2>
            <p style="font-size:11px; margin-top:12px;">Production, perspective, and the science of sound.</p>
          </div>
          <div class="ui-panel panel-blog-list" id="blog-list">
            <!-- Blog posts will be injected here -->
          </div>
          <div class="ui-panel panel-blog-g">
            <a href="https://lhg-records.pages.dev" class="footer-link">MORE POSTS →</a>
          </div>
        </div>

      </div>

      <!-- MAIN APP NAVIGATION -->
      <div class="hero-eyebrow">DnB · Liquid · Neurofunk · UK Garage</div>
      <div class="logo-subtitle">LOVE HEAL GROW</div>
      <div class="hero-ctas" style="margin-top: 30px;">
        <button class="nav-btn active" data-state="home" aria-label="Navigate to Home"
          onclick="navigateTo('home')">Home</button>
        <button class="nav-btn" data-state="music" aria-label="Navigate to Music"
          onclick="navigateTo('music')">Music</button>
        <button class="nav-btn" data-state="blog" aria-label="Navigate to Blog"
          onclick="navigateTo('blog')">Blog</button>
      </div>
    </div>
  </section>

  <script type="module">
    // Global audio element
    let audio = new Audio();
    let currentTrackIndex = 0;
    let isPlaying = false;

    // Sample tracks - Replace with your actual tracks
    const tracks = [
      {
        title: "Baptize 3",
        artist: "N-Dread",
        url: "https://pub-933187144c8d40248ea8b348fb920bef.r2.dev/baptize.mp3"
      },
      {
        title: "Euphoria in Shadows",
        artist: "Echo Ray",
        url: "https://pub-933187144c8d40248ea8b348fb920bef.r2.dev/euphoria.mp3"
      },
      {
        title: "Secret Rendezvous",
        artist: "Zephyr Noir",
        url: "https://pub-933187144c8d40248ea8b348fb920bef.r2.dev/rendezvous.mp3"
      }
    ];

    // Sample blog posts
    const blogPosts = [
      {
        title: "Liquid DnB: Sound Design From Scratch",
        excerpt: "Breaking down the reese bass construction that defines the Echo Ray sound...",
        date: "Jun 2026",
        url: "https://lhg-records.pages.dev"
      },
      {
        title: "The Neurofunk Mindset",
        excerpt: "How systems thinking shapes every arrangement decision in the studio...",
        date: "May 2026",
        url: "https://lhg-records.pages.dev"
      },
      {
        title: "Building LHG Records From Zero",
        excerpt: "The independent label blueprint — distribution, identity, and community...",
        date: "Apr 2026",
        url: "https://lhg-records.pages.dev"
      }
    ];

    // Initialize
    function init() {
      renderTracks();
      renderBlogPosts();
      initParticles();
      
      // Audio event listeners
      audio.addEventListener('timeupdate', updateProgress);
      audio.addEventListener('ended', nextTrack);
      audio.addEventListener('loadedmetadata', () => {
        updateTimeDisplay();
      });
    }

    // Navigation
    window.navigateTo = function(state) {
      // Update nav buttons
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('active');
        if (btn.dataset.state === state) {
          btn.classList.add('active');
        }
      });

      // Update state overlays
      document.querySelectorAll('.state-overlay').forEach(overlay => {
        overlay.classList.remove('active');
      });

      const targetOverlay = document.getElementById(`state-${state}`);
      if (targetOverlay) {
        targetOverlay.classList.add('active');
      }
    };

    // Render tracks
    function renderTracks() {
      const trackList = document.getElementById('track-list');
      trackList.innerHTML = tracks.map((track, index) => `
        <div class="track-item ${index === 0 ? 'active' : ''}" onclick="loadTrack(${index})">
          <div class="track-title">${track.title}</div>
          <div class="track-artist">${track.artist}</div>
        </div>
      `).join('');
    }

    // Render blog posts
    function renderBlogPosts() {
      const blogList = document.getElementById('blog-list');
      blogList.innerHTML = blogPosts.map(post => `
        <div class="blog-post" onclick="window.open('${post.url}', '_blank')">
          <h3>${post.title}</h3>
          <p>${post.excerpt}</p>
          <div class="blog-post-date">${post.date}</div>
        </div>
      `).join('');
    }

    // Load track
    window.loadTrack = function(index) {
      currentTrackIndex = index;
      const track = tracks[index];
      
      audio.src = track.url;
      document.getElementById('audio-title').textContent = track.title;
      document.getElementById('audio-artist').textContent = track.artist;
      
      // Update active state
      document.querySelectorAll('.track-item').forEach((item, i) => {
        item.classList.toggle('active', i === index);
      });
      
      // Auto-play if already playing
      if (isPlaying) {
        audio.play();
      }
    };

    // Toggle play/pause
    window.togglePlay = function() {
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
        document.getElementById('play-btn').textContent = 'Play';
      } else {
        // Load first track if nothing loaded
        if (!audio.src || audio.src === '') {
          loadTrack(0);
        }
        audio.play();
        isPlaying = true;
        document.getElementById('play-btn').textContent = 'Pause';
      }
    };

    // Previous track
    window.prevTrack = function() {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) audio.play();
    };

    // Next track
    window.nextTrack = function() {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      loadTrack(currentTrackIndex);
      if (isPlaying) audio.play();
    };

    // Seek audio
    window.seekAudio = function(event) {
      const progressContainer = document.getElementById('progress-container');
      const clickX = event.offsetX;
      const width = progressContainer.offsetWidth;
      const percentage = clickX / width;
      audio.currentTime = audio.duration * percentage;
    };

    // Update progress bar
    function updateProgress() {
      if (audio.duration) {
        const percentage = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progress-bar').style.width = percentage + '%';
        updateTimeDisplay();
      }
    }

    // Update time display
    function updateTimeDisplay() {
      const current = audio.currentTime || 0;
      const minutes = Math.floor(current / 60);
      const seconds = Math.floor(current % 60);
      document.getElementById('audio-time').textContent = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
    }

    // Particle background
    function initParticles() {
      const canvas = document.getElementById('hero-canvas');
      const ctx = canvas.getContext('2d');
      
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const particles = [];
      const particleCount = 50;

      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.vx = (Math.random() - 0.5) * 0.5;
          this.vy = (Math.random() - 0.5) * 0.5;
          this.radius = Math.random() * 2 + 0.5;
          this.opacity = Math.random() * 0.3 + 0.1;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;

          if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
          if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
        }

        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(200, 255, 0, ${this.opacity})`;
          ctx.fill();
        }
      }

      for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        particles.forEach(particle => {
          particle.update();
          particle.draw();
        });

        // Draw connections
        particles.forEach((p1, i) => {
          particles.slice(i + 1).forEach(p2 => {
            const dx = p1.x - p2.x;
            const dy = p1.y - p2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 150) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(200, 255, 0, ${0.1 * (1 - distance / 150)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          });
        });

        requestAnimationFrame(animate);
      }
      animate();
    }

    // Initialize on load
    init();
  </script>
</body>

</html>
